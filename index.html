<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Search, browse, filter, and save anime using live data from MyAnimeList." />
  <meta name="theme-color" content="#0d0d0f" />
  <title>Anime Explorer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://api.jikan.moe" crossorigin />
  <link rel="preconnect" href="https://cdn.myanimelist.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <a class="skip-link" href="#results">Skip to results</a>

  <header>
    <h1>ANIME EXPLORER</h1>
    <form id="search-form" role="search">
      <label for="search-input" class="visually-hidden">Search anime</label>
      <input id="search-input" type="search" placeholder="Search anime…" autocomplete="off" enterkeyhint="search" maxlength="100" required />
      <button type="submit">Search</button>
      <button id="browse-btn" type="button">Browse All</button>
    </form>
    <div class="filters" role="group" aria-label="Filters">
      <select id="filter-type" aria-label="Filter by type">
        <option value="">All Types</option>
        <option value="tv">TV</option>
        <option value="movie">Movie</option>
        <option value="ova">OVA</option>
        <option value="ona">ONA</option>
        <option value="special">Special</option>
      </select>
      <select id="filter-score" aria-label="Filter by score">
        <option value="">Any Score</option>
        <option value="9">9+ Score</option>
        <option value="8">8+ Score</option>
        <option value="7">7+ Score</option>
        <option value="6">6+ Score</option>
      </select>
      <select id="filter-status" aria-label="Filter by status">
        <option value="">Any Status</option>
        <option value="airing">Airing</option>
        <option value="complete">Finished</option>
        <option value="upcoming">Upcoming</option>
      </select>
      <select id="sort-by" aria-label="Sort by">
        <option value="members">Most Popular</option>
        <option value="score">Top Rated</option>
        <option value="start_date">Newest</option>
        <option value="title">Title A–Z</option>
      </select>
      <button id="random-btn" type="button">Random</button>
      <button id="saved-btn" type="button" aria-pressed="false">
        Saved <span id="saved-count" class="badge hidden"></span>
      </button>
    </div>
  </header>

  <main id="results" tabindex="-1">
    <div class="results-bar">
      <h2 id="results-heading" tabindex="-1">Popular anime</h2>
      <p id="results-status" role="status"></p>
    </div>
    <section id="grid" aria-labelledby="results-heading"></section>
    <div id="message" class="message hidden" aria-live="polite">
      <p id="message-text"></p>
      <button id="message-btn" type="button" class="hidden"></button>
    </div>
    <div id="load-more-wrap" class="hidden">
      <button id="load-more-btn" type="button">Load More</button>
    </div>
  </main>

  <footer>
    <p>Data from <a href="https://jikan.moe" target="_blank" rel="noopener noreferrer">Jikan / MyAnimeList</a></p>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <button id="modal-close" type="button" aria-label="Close">✕</button>
    <div class="modal-box">
      <div class="modal-poster">
        <img id="modal-image" alt="" width="225" height="350" />
      </div>
      <div class="modal-right">
        <h2 id="modal-title"></h2>
        <p id="modal-subtitle"></p>
        <div class="modal-stats">
          <p><span class="label">Score</span>    <span id="modal-score"></span></p>
          <p><span class="label">Type</span>     <span id="modal-type"></span></p>
          <p><span class="label">Episodes</span> <span id="modal-episodes"></span></p>
          <p><span class="label">Status</span>   <span id="modal-status"></span></p>
          <p><span class="label">Year</span>     <span id="modal-year"></span></p>
          <p><span class="label">Studios</span>  <span id="modal-studios"></span></p>
        </div>
        <ul id="modal-genres" class="genres" aria-label="Genres"></ul>
        <div class="modal-actions">
          <button id="modal-fave-btn" type="button" aria-pressed="false">Save</button>
          <a id="modal-trailer" class="trailer-btn hidden" target="_blank" rel="noopener noreferrer">▶ Watch Trailer</a>
          <a id="modal-mal-link" class="mal-link" target="_blank" rel="noopener noreferrer">MyAnimeList ↗</a>
        </div>
        <p id="modal-overview"></p>
      </div>
    </div>
  </dialog>

  <div id="toast" role="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
